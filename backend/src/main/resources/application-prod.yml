server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: real-time-chat-application

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rtca_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:9a2f8c4e7b1a3d5e8f0a2c4e6b8d1a3f5e7c9b0a2d4f6e8a1c3b5d7e9f0a2b4c}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    root: INFO
    com.rtca: INFO
